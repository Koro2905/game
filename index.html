<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIXEL QUEST</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-title">✦ PIXEL QUEST ✦</div>

  <div class="game-wrapper">

    <!-- HUD (поверх канваса) -->
    <div class="hud">
      <div class="hud-item">
        <span class="hud-icon">🪙</span>
        <div>
          <div class="hud-label">МОНЕТЫ</div>
          <div class="hud-value" id="coins">0</div>
        </div>
      </div>
      <div class="hud-item">
        <span class="hud-icon">❤️</span>
        <div>
          <div class="hud-label">ЖИЗНИ</div>
          <div class="hud-value" id="lives">3</div>
        </div>
      </div>
      <div class="hud-item">
        <span class="hud-icon">🏆</span>
        <div>
          <div class="hud-label">УРОВЕНЬ</div>
          <div class="hud-value" id="level">1</div>
        </div>
      </div>
      <div class="hud-item">
        <span class="hud-icon">🔫</span>
        <div>
          <div class="hud-label">ПАТРОНЫ</div>
          <div class="hud-value" id="ammo">10</div>
        </div>
      </div>
    </div>

    <canvas id="game" width="800" height="450"></canvas>

    <!-- Оверлей: меню / game over / победа -->
    <div id="overlay" class="overlay">
      <h1 id="overlay-title">PIXEL QUEST</h1>
      <div class="pixel-divider"></div>
      <p id="overlay-text">Собери монеты и доберись до флага!</p>
      <button id="start-btn">▶ ИГРАТЬ</button>
    </div>

    <!-- CRT-линии поверх всего -->
    <div class="scanlines"></div>

  </div>

  <!-- Подсказка управления -->
  <div class="controls-hint">
    <div class="ctrl-group">
      <span class="key">← → A D</span>
      <span>движение</span>
    </div>
    <span class="ctrl-sep">|</span>
    <div class="ctrl-group">
      <span class="key">↑ W Пробел</span>
      <span>прыжок</span>
    </div>
    <span class="ctrl-sep">|</span>
    <div class="ctrl-group">
      <span class="key">F X</span>
      <span>стрелять</span>
    </div>
    <span class="ctrl-sep">|</span>
    <div class="ctrl-group">
      <span class="key">R</span>
      <span>рестарт</span>
    </div>
  </div>

  <!-- Порядок загрузки важен: каждый файл использует переменные из предыдущих -->
  <script src="js/constants.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/state.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/render.js"></script>
  <script src="js/update.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
